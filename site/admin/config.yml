backend:
  name: github
  repo: sebtautou-max/vactennis
  branch: main
  base_url: https://oauth-proxy.sebtautou.workers.dev
  auth_endpoint: auth

media_folder: "site/img/uploads"
public_folder: "/img/uploads"

collections:
  - name: "actualites"
    label: "Actualités"
    folder: "site/actualites"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Catégorie", name: "category", widget: "select", options: ["Tournoi", "Stage", "Compétition", "Club", "Résultats"], required: false }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Image", name: "image", widget: "image", required: false, hint: "JPG/JPEG impérativement (pas de PNG transparent). Format paysage 16:9 recommandé, ~1200x675px. Si l_image apparaît vide après publication, lancer : python3 backend/normalize-image.py site/img/uploads/NOM.jpg", media_library: {config: {multiple: false}} }
      - { label: "Contenu", name: "body", widget: "markdown" }
